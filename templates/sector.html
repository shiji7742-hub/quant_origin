<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>强势板块扫描 - 量化选股</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        .header {
            background: #222;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: normal;
            color: #e0e0e0;
        }
        
        .back-btn {
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
        
        .back-btn:hover { color: #ccc; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auth-pill {
            font-size: 12px;
            color: #d6d6d6;
            background: #2b2b2b;
            border: 1px solid #3a3a3a;
            padding: 8px 12px;
            border-radius: 999px;
        }

        .logout-link {
            color: #d6d6d6;
            text-decoration: none;
            font-size: 14px;
        }

        .logout-link:hover { color: #fff; }
        
        .main {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }
        
        .sidebar {
            background: #222;
            border-radius: 10px;
            padding: 20px;
        }
        
        .sidebar-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .prescan-btn {
            padding: 6px 12px;
            background: #c9a227;
            color: #1a1a1a;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .prescan-btn:hover { background: #d9b237; }
        
        .sector-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .sector-item {
            padding: 12px 15px;
            background: #2a2a2a;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
        }
        
        .sector-item:hover { background: #333; }
        .sector-item.active {
            border-color: #c9a227;
            background: #2a2520;
        }
        
        .sector-item .name { flex: 1; font-size: 14px; }
        .sector-item .info { font-size: 11px; color: #666; margin-right: 10px; }
        .sector-item .change { font-size: 13px; }
        .sector-item .change.up { color: #e74c3c; }
        .sector-item .change.down { color: #27ae60; }
        
        .content {
            background: #222;
            border-radius: 10px;
            padding: 20px;
        }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        
        .select-box {
            padding: 10px 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
            min-width: 160px;
        }
        
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn-primary {
            background: #e0e0e0;
            color: #1a1a1a;
        }
        
        .btn-primary:hover { background: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-left: auto;
        }
        
        .stat { text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; color: #c9a227; }
        .stat-label { font-size: 12px; color: #666; }
        
        .result-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .result-table th {
            text-align: left;
            padding: 12px 15px;
            font-size: 12px;
            color: #666;
            border-bottom: 1px solid #333;
        }
        
        .result-table td {
            padding: 12px 15px;
            font-size: 14px;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .result-table tr:hover { background: #2a2a2a; cursor: pointer; }
        .result-table .code { color: #c9a227; }
        .result-table .up { color: #e74c3c; }
        .result-table .down { color: #27ae60; }
        .result-table .tag {
            font-size: 11px;
            padding: 3px 8px;
            background: #333;
            border-radius: 4px;
            color: #888;
        }
        
        .empty-tip {
            text-align: center;
            color: #555;
            padding: 60px;
        }
        
        .status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 10px;
        }
        
        .status.ready { background: rgba(39,174,96,0.2); color: #27ae60; }
        .status.loading { background: rgba(201,162,39,0.2); color: #c9a227; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .header-actions {
                width: 100%;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>强势板块个股扫描</h1>
        <div class="header-actions">
            <span class="auth-pill">已登录：{{ current_user }}</span>
            <a href="/workspace" class="back-btn">← 返回工作台</a>
            <a href="/logout" class="logout-link">退出登录</a>
        </div>
    </div>
    
    <div class="main">
        <div class="sidebar">
            <div class="sidebar-title">
                潜力板块 <span class="status" id="status">未扫描</span>
                <button class="prescan-btn" onclick="prescan()">⚡ 预扫描</button>
            </div>
            <div class="sector-list" id="sectorList">
                <div class="empty-tip">点击预扫描加载</div>
            </div>
        </div>
        
        <div class="content">
            <div class="controls">
                <select id="strategy" class="select-box">
                    <option value="涨停破位洗盘">涨停破位洗盘</option>
                    <option value="缩量横盘整理">缩量横盘整理</option>
                    <option value="深度回调支撑">深度回调支撑</option>
                    <option value="箱体突破">箱体突破</option>
                    <option value="均线粘合发散">均线粘合发散</option>
                    <option value="地量见底">地量见底</option>
                </select>
                <button class="btn btn-primary" id="scanBtn" onclick="scanSector()">扫描板块</button>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="sectorCount">0</div>
                        <div class="stat-label">潜力板块</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="matched">0</div>
                        <div class="stat-label">符合条件</div>
                    </div>
                </div>
            </div>
            
            <table class="result-table">
                <thead>
                    <tr>
                        <th>代码</th>
                        <th>名称</th>
                        <th>涨跌幅</th>
                        <th>板块</th>
                        <th>说明</th>
                    </tr>
                </thead>
                <tbody id="results">
                    <tr><td colspan="5" class="empty-tip">选择板块后点击扫描</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
let selectedSector = null;

async function getApiData(url, options) {
    const response = await fetch(url, options);
    const responseText = await response.text();
    const trimmedText = responseText.trim();
    let result = null;

    if (trimmedText) {
        try {
            result = JSON.parse(trimmedText);
        } catch (error) {
            result = null;
        }
    }

    if (response.status === 401 || result?.login_required) {
        window.location.href = result?.login_url || `/login?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
        throw new Error('login-required');
    }

    if (!result) {
        if (response.status === 504) {
            throw new Error('扫描超时，服务器网关未及时返回结果，请稍后重试');
        }
        if (trimmedText.startsWith('<')) {
            throw new Error(`服务器返回了 HTML 错误页 (${response.status || 'unknown'})`);
        }
        throw new Error(response.ok ? '服务器返回了无法解析的响应' : `请求失败 (${response.status})`);
    }

    if (!response.ok || !result.success) {
        throw new Error(result.error || `请求失败 (${response.status})`);
    }

    return result;
}

// 从localStorage恢复数据
function restoreData() {
    // 恢复板块列表
    const savedSectors = localStorage.getItem('sector_potentialSectors');
    if (savedSectors) {
        try {
            const sectors = JSON.parse(savedSectors);
            if (sectors && sectors.length > 0) {
                document.getElementById('sectorCount').textContent = sectors.length;
                displaySectors(sectors);
                document.getElementById('status').textContent = '已缓存';
                document.getElementById('status').className = 'status ready';
                console.log('恢复板块数据:', sectors.length, '个板块');
            }
        } catch (e) {
            console.error('恢复板块数据失败:', e);
        }
    }
    
    // 恢复扫描结果
    const savedResults = localStorage.getItem('sector_scanResults');
    const savedSector = localStorage.getItem('sector_selectedSector');
    const savedMatched = localStorage.getItem('sector_matchedCount');
    const savedStrategy = localStorage.getItem('sector_strategy');
    
    if (savedResults) {
        try {
            const results = JSON.parse(savedResults);
            displayResults(results);
        } catch (e) {
            console.error('恢复扫描结果失败:', e);
        }
    }
    if (savedMatched) {
        document.getElementById('matched').textContent = savedMatched;
    }
    if (savedStrategy) {
        document.getElementById('strategy').value = savedStrategy;
    }
    if (savedSector) {
        selectedSector = savedSector;
        // 高亮选中的板块
        setTimeout(() => {
            document.querySelectorAll('.sector-item').forEach(el => {
                if (el.querySelector('.name').textContent === savedSector) {
                    el.classList.add('active');
                }
            });
        }, 100);
    }
}

async function prescan() {
    const status = document.getElementById('status');
    const list = document.getElementById('sectorList');
    
    status.textContent = '扫描中...';
    status.className = 'status loading';
    list.innerHTML = '<div class="empty-tip">正在扫描潜力板块...</div>';
    
    try {
        await getApiData('/api/prescan', {method: 'POST'});
        status.textContent = '已就绪';
        status.className = 'status ready';
        await loadSectors();
    } catch (error) {
        if (error.message === 'login-required') {
            return;
        }
        status.textContent = '失败';
        list.innerHTML = '<div class="empty-tip">预扫描失败</div>';
    }
}

async function loadSectors() {
    try {
        const result = await getApiData('/api/potential-sectors');
        if (result.data.length > 0) {
            document.getElementById('sectorCount').textContent = result.data.length;
            displaySectors(result.data);
            // 保存到localStorage
            localStorage.setItem('sector_potentialSectors', JSON.stringify(result.data));
            return;
        }

        document.getElementById('sectorCount').textContent = '0';
        document.getElementById('sectorList').innerHTML = '<div class="empty-tip">当前没有符合条件的潜力板块</div>';
        localStorage.removeItem('sector_potentialSectors');
    } catch (error) {
        if (error.message !== 'login-required') {
            console.error('加载失败:', error);
            document.getElementById('sectorList').innerHTML = `<div class="empty-tip">${error.message || '板块加载失败'}</div>`;
        }
    }
}

function displaySectors(sectors) {
    const list = document.getElementById('sectorList');
    
    list.innerHTML = sectors.map(s => `
        <div class="sector-item" onclick="selectSector('${s.name}', this)">
            <span class="name">${s.name}</span>
            <span class="info">回撤${s.drawdown}%</span>
            <span class="change ${s.change > 0 ? 'up' : 'down'}">${s.change > 0 ? '+' : ''}${s.change.toFixed(2)}%</span>
        </div>
    `).join('');
}

function selectSector(name, el) {
    document.querySelectorAll('.sector-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    selectedSector = name;
    localStorage.setItem('sector_selectedSector', name);
}

async function scanSector() {
    if (!selectedSector) {
        alert('请先选择一个板块');
        return;
    }
    
    const btn = document.getElementById('scanBtn');
    const strategy = document.getElementById('strategy').value;
    
    btn.disabled = true;
    btn.textContent = '扫描中...';
    
    // 保存选中的策略
    localStorage.setItem('sector_strategy', strategy);
    
    try {
        const result = await getApiData(`/api/scan-sector?sector=${encodeURIComponent(selectedSector)}&strategy=${encodeURIComponent(strategy)}`);
        document.getElementById('matched').textContent = result.data.length;
        displayResults(result.data);
        // 保存到localStorage
        localStorage.setItem('sector_scanResults', JSON.stringify(result.data));
        localStorage.setItem('sector_matchedCount', result.data.length);
    } catch (error) {
        if (error.message !== 'login-required') {
            console.error('扫描失败:', error);
        }
    } finally {
        btn.disabled = false;
        btn.textContent = '扫描板块';
    }
}

function displayResults(stocks) {
    const tbody = document.getElementById('results');
    
    if (stocks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-tip">该板块暂无符合条件的股票</td></tr>';
        return;
    }
    
    tbody.innerHTML = stocks.map(s => `
        <tr>
            <td class="code">${s['代码']}</td>
            <td>${s['名称'] || '-'}</td>
            <td class="${s['涨跌幅'] > 0 ? 'up' : 'down'}">${s['涨跌幅'] > 0 ? '+' : ''}${s['涨跌幅'].toFixed(2)}%</td>
            <td><span class="tag">${s['板块'] || '-'}</span></td>
            <td style="color:#666;font-size:12px;">${s['说明'] || '-'}</td>
        </tr>
    `).join('');
}

// 初始化
async function init() {
    const savedSectors = localStorage.getItem('sector_potentialSectors');
    
    if (savedSectors) {
        // 有缓存，直接恢复
        restoreData();
    } else {
        // 没有缓存，自动预扫描一次
        await prescan();
    }
}

init();
</script>
</body>
</html>
